repos:
  # Ruff: linting (with import sorting) and formatting, configured in pyproject.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Strict type checking, configured in pyproject.toml
      - id: mypy
        name: Type check with mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Unit tests
      - id: pytest-unit
        name: Run unit tests
        entry: uv run pytest tests/ -v --ignore=tests/integration
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Integration tests
      - id: pytest-integration
        name: Run integration tests
        entry: bash -c 'if [ "$RUN_INTEGRATION_TESTS" = "1" ]; then uv run pytest tests/integration/ -v; else echo "Skipping integration tests (env vars not set)"; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

default_language_version:
  python: python3

fail_fast: true

default_stages: [pre-commit]
